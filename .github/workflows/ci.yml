# ci — build + test on every push and PR.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          version: 'v0.10.0'

      - name: Command tests
        run: ./tests/run.sh

      - name: Release bootstrap tests
        run: ./tests/release.sh

      - name: MCP format
        run: cargo fmt --manifest-path mcp/Cargo.toml --check

      - name: MCP tests
        run: cargo test --manifest-path mcp/Cargo.toml --locked

      - name: MCP lint
        run: cargo clippy --manifest-path mcp/Cargo.toml --all-targets --locked -- -D warnings
