name: release

# Bumps the workspace version on every push to main (i.e. after a
# merge), then tags vX.Y.Z. Bump logic lives in scripts/bump-version.sh
# (installed by squadron/bin/bump-version --install) so it runs standalone in
# CI with no squadron/bin on PATH.
#
# branches/BUMPVER_MAIN_BRANCH below are this repo's ACTUAL default branch,
# detected at install time (not hardcoded 'main' — see squadron/bin/bump-
# version's detect_default_branch(); a repo whose default is master got a
# release job that could never fire on a real push before this).
#
# Loop-safe: pushes made with the default GITHUB_TOKEN do NOT trigger new
# workflow runs (a deliberate GitHub behavior), so the bump commit won't
# recurse. The commit message also carries [skip ci].
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  bump:
    runs-on: ubuntu-latest
    if: github.actor != 'water-spider-release'
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags are needed for `git describe`
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        if: hashFiles('Cargo.toml') != ''
      - name: bump + tag + push
        env:
          BUMPVER_MAIN_BRANCH: main
          BUMPVER_GIT_USER: water-spider-release
          BUMPVER_GIT_EMAIL: release@water-spider-repo.local
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # so `gh release create` inside the script authenticates
        run: ./scripts/bump-version.sh
      - name: Export released version
        id: version
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-ghcr:
    name: publish GHCR (${{ matrix.tag }})
    needs: bump
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            tag: latest
            version_prefix: ""
          - dockerfile: Dockerfile.runpod
            tag: pod
            version_prefix: pod-
          - dockerfile: Dockerfile.v2
            tag: v2
            version_prefix: v2-
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ needs.bump.outputs.version }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/nixpt/water-spider:${{ matrix.tag }}
            ghcr.io/nixpt/water-spider:${{ matrix.version_prefix }}${{ needs.bump.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/nixpt/water-spider
            org.opencontainers.image.version=${{ needs.bump.outputs.version }}
            org.opencontainers.image.revision=${{ needs.bump.outputs.revision }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
